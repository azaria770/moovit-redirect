<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פותח את Moovit...</title>
    <style>
        body {
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: 80px;
            background-color: #f7f9fc;
            color: #333;
        }
        /* עיצוב אנימציית הטעינה - צבעים המזכירים את מוביט */
        .spinner {
            border: 6px solid #e0e0e0;
            border-top: 6px solid #ee6c00; 
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .main-text {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #2c3e50;
        }
        .blessing-text {
            font-size: 18px;
            color: #555;
            padding: 0 15px;
        }
    </style>
    <script>
        window.onload = function() {
            // קריאת הפרמטרים (קואורדינטות) מתוך הלינק
            const params = new URLSearchParams(window.location.search);
            const lat = params.get('lat');
            const lon = params.get('lon');

            if (lat && lon) {
                // הרכבת הסכמה של מוביט והפעלתה
                const moovitUrl = "moovit://directions?dest_lat=" + lat + "&dest_lon=" + lon;
                const fallbackUrl = "https://play.google.com/store/apps/details?id=com.tranzmate";

                // מנסה לפתוח את האפליקציה
                window.location.href = moovitUrl;

                // אם אין אפליקציה, מעביר לחנות אחרי שנייה
                setTimeout(function() {
                    window.location.href = fallbackUrl;
                }, 1000);
            } else {
                // הודעת שגיאה במידה ואין קואורדינטות בלינק
                document.body.innerHTML = "<h2 style='margin-top: 100px; color: #d32f2f;'>שגיאה: חסרות קואורדינטות</h2>";
            }
        };
    </script>
</head>
<body>
    <div class="spinner"></div>
    <div class="main-text">מעביר אותך לניווט ב-Moovit...</div>
    <div class="blessing-text">דרך צלחה!! אל תשכח תפילת הדרך אם נדרש</div>
</body>
</html>
